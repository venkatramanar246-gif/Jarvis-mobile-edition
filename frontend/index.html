<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>J.A.R.V.I.S</h1>
    <p>MOBILE EDITION</p>
  </header>

  <div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="center"></div>
  </div>

  <p class="core-text">CORE ACTIVE</p>

  <div class="status">
    <h2>SYSTEM STATUS</h2>

    <div class="row">
      <span>AI CORE</span>
      <b class="on">● ONLINE</b>
    </div>

    <div class="row">
      <span>NETWORK</span>
      <b class="on">● ONLINE</b>
    </div>

    <div class="row">
      <span>VOICE</span>
      <b class="off">● LOCKED</b>
    </div>

    <div class="row">
      <span>MEMORY</span>
      <b class="off">● LOCKED</b>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input
      id="msg"
      type="text"
      placeholder="Ask J.A.R.V.I.S..."
      autocomplete="off"
    >
    <button id="send" type="button">SEND</button><button id="mic-btn">🎙️</button>
  </div>
